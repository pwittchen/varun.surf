name: Android # lint, unit tests and a release build of the Android app (android/)

on:
  push:
    branches: [ "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release (R8)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: varun-surf-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    # android-vX.Y.Z tag -> signed AAB on the Play Console internal track; promotion is manual
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Bundle release
        env:
          VERSION_CODE: ${{ github.run_number }}
          VARUN_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          VARUN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VARUN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VARUN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -Pvarun.versionName="${GITHUB_REF_NAME#android-v}" --stacktrace

      - name: Upload to Play Console (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: surf.varun.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
