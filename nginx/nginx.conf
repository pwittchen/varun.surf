worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS ends at the edge, so $scheme is plain http even for a visitor on https.
    # The application needs the visitor's scheme to decide whether the session
    # cookie may be marked Secure, so pass on what the edge reported and fall back
    # to our own scheme for direct local runs.
    map $http_x_forwarded_proto $forwarded_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }

    # ---------------------------------------------------------------------------
    # real client address
    # ---------------------------------------------------------------------------
    # Behind Cloudflare $remote_addr is the edge, not the visitor, which would put
    # the whole internet into a single rate-limit bucket and make the access log
    # useless. Refresh these from https://www.cloudflare.com/ips/ when they change.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # the local hop between the host's port proxy and this container
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ---------------------------------------------------------------------------
    # rate limiting
    # ---------------------------------------------------------------------------
    # api:   a page load fires a handful of calls at once, so the burst matters more
    #        than the rate; nodelay lets that burst through without queueing it.
    # heavy: the endpoints that cost real work or real bytes - the all-spots wind
    #        timeline, the markdown dumps, and the password-protected logs, where a
    #        slow trickle is also what stops a brute force on the basic auth.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=heavy:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;

        set $backend http://varun-app-current:8080;

        # Inherited by every location below, so each one only declares its own
        # proxy_pass and whatever limit it needs.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;

        # Inherited the same way, but only by locations that declare no add_header
        # of their own - nginx replaces the whole inherited set rather than adding
        # to it, so a location that adds one header must repeat these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-Only on purpose: the frontend carries inline styles and scripts and
        # pulls map tiles, so enforcing this straight away would break pages. Watch
        # the browser console for violations, tighten, then rename the header.
        # frame-ancestors is deliberately absent - /embed exists to be framed.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; font-src 'self' data:; frame-src 'self' https:; base-uri 'self'; form-action 'self'" always;

        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /actuator/metrics {
            return 403;
        }

        location /actuator/prometheus {
            return 403;
        }

        # The all-spots wind timeline is the single most expensive response the API
        # serves, so it gets its own bucket rather than sharing the general one.
        location /api/v1/wind {
            limit_req zone=heavy burst=5;
            proxy_pass $backend;
        }

        location /api/v1/logs {
            limit_req zone=heavy burst=3;
            proxy_pass $backend;
        }

        location /api/v1/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass $backend;
        }

        # Markdown for LLMs: whole-database dumps, served without a session cookie
        # by design, which makes them the cheapest thing to scrape in bulk.
        location /llms/ {
            limit_req zone=heavy burst=5;
            proxy_pass $backend;
        }

        # SSE connections are held open, so cap how many one client may hold rather
        # than how often it may open them.
        location /mcp/ {
            limit_conn conn 4;
            limit_req zone=heavy burst=5;
            proxy_pass $backend;
        }

        location / {
            proxy_pass $backend;
        }
    }
}
