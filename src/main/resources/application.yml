server:
  port: 8080

spring:
  application:
    name: varun.surf
    version: ${version}
  ai:
    openai:
      api-key: YOUR_API_KEY
      chat:
        options:
          model: gpt-4o-mini
    mcp:
      server:
        enabled: true
        name: varun-surf
        version: ${version}
        type: ASYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        instructions: >-
          MCP server for varun.surf - kitesurfing weather forecasts and live wind conditions.
          Use the provided tools to look up kite spots, check current wind, and read
          daily/hourly forecasts. Spot identifiers are integer Windguru IDs (wgId).

management:
  endpoints:
    web:
      exposure:
         include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: varun.surf

app:
  feature:
    ai:
      forecast:
        analysis:
          enabled: false
    icm:
      vision:
        enabled: false
  analytics:
    password: "\${ANALYTICS_PASSWORD:}"
  session:
    max-age-seconds: 86400
    # Signs the SESSION cookie. Left empty a random one is generated at startup,
    # which works but invalidates every cookie on restart and is not shared between
    # the blue and green containers, so set it in production.
    secret: "\${APP_SESSION_SECRET:}"
  wunderground:
    # No default on purpose: this repository is public, and a key committed here is
    # a published key. Without it the Turawa South station is simply skipped.
    api-key: "\${WUNDERGROUND_API_KEY:}"
  proxy:
    # Oxylabs residential proxy for outgoing requests, off for every target by default.
    # Each target has its own switch because the proxy is paid per gigabyte: Windguru
    # blocked the production IP, the live stations never did. OpenAI is never proxied -
    # Spring AI reaches it through its own HTTP client. A target switched on without
    # credentials goes direct and logs a warning. The /metrics page shows which
    # targets are proxied. Credentials only from the environment (.env).
    oxylabs:
      host: pr.oxylabs.io
      port: 7777
      username: "\${OXYLABS_USERNAME:}"
      password: "\${OXYLABS_PASSWORD:}"
      # Optional exit country (ISO code, e.g. PL); empty picks from the whole pool
      country: "\${OXYLABS_COUNTRY:}"
    windguru:
      enabled: false          # micro.windguru.cz forecasts and model discovery
    live-stations:
      enabled: false          # the live weather station strategies
    other:
      enabled: false          # Google Maps, ICM meteo.pl and the source pings
