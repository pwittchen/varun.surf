<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title data-i18n="logsPageTitle">Logs - VARUN.SURF</title>
    <meta name="description"
          content="Application logs for VARUN.SURF - kitesurfing weather forecast dashboard">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
    <script
            defer
            data-website-id="dfid_yUtxeXdTh4uWWN5KSQ3qU"
            data-domain="varun.surf"
            src="https://datafa.st/js/script.js">
    </script>
</head>
<body class="tools-page">
<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="container">

        <main class="status-page">
            <div class="status-container">
                <!-- Auto-refresh indicator -->
                <div class="status-card">
                    <div class="status-header">
                        <div class="status-indicator">
                            <span class="status-dot status-dot-up logs-refresh-dot"></span>
                            <!-- the auto-refresh label and button follow the paused state, so the
                                 page renders them rather than data-i18n -->
                            <span class="status-text" id="refresh-status">Auto-refresh: 5s</span>
                        </div>
                        <div class="status-header-actions">
                            <span class="status-time" id="last-updated">Last updated: -</span>
                            <button id="toggle-refresh" class="btn btn-small btn-secondary">
                                Pause Auto-Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div class="status-card">
                    <div class="logs-filter-controls">
                        <div class="logs-filter-group">
                            <label for="level-filter" data-i18n="logsLevelLabel">Level:</label>
                            <select id="level-filter" class="logs-select">
                                <option value="" data-i18n="logsAllLevels">ALL</option>
                                <option value="ERROR">ERROR</option>
                                <option value="WARN">WARN</option>
                                <option value="INFO">INFO</option>
                                <option value="DEBUG">DEBUG</option>
                                <option value="TRACE">TRACE</option>
                            </select>
                        </div>
                        <div class="logs-filter-group logs-filter-search">
                            <label for="search-filter" data-i18n="logsSearchLabel">Search:</label>
                            <input type="text" id="search-filter" class="logs-input"
                                   data-i18n-placeholder="logsSearchPlaceholder" placeholder="Filter logs...">
                        </div>
                        <div class="logs-filter-group">
                            <span class="logs-count" id="logs-count">0 logs</span>
                        </div>
                    </div>
                </div>

                <!-- Logs Container -->
                <div class="status-card logs-card">
                    <div class="logs-table-container">
                        <table class="logs-table">
                            <thead>
                                <tr>
                                    <th class="logs-th-time" data-i18n="logsTimeHeader">Time</th>
                                    <th class="logs-th-level" data-i18n="logsLevelHeader">Level</th>
                                    <th class="logs-th-logger" data-i18n="logsLoggerHeader">Logger</th>
                                    <th class="logs-th-message" data-i18n="logsMessageHeader">Message</th>
                                </tr>
                            </thead>
                            <tbody id="logs-body">
                                <!-- Logs will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <!-- Footer content rendered by JavaScript -->
            </div>
        </footer>
    </div>
</div>
<script type="module" src="../js/page/logs.js"></script>
</body>
</html>
