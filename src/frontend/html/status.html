<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title data-i18n="statusPageTitle">Status - VARUN.SURF</title>
    <meta name="description"
          content="System status and uptime information for VARUN.SURF - kitesurfing weather forecast dashboard">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
    <script
            defer
            data-website-id="dfid_yUtxeXdTh4uWWN5KSQ3qU"
            data-domain="varun.surf"
            src="https://datafa.st/js/script.js">
    </script>
</head>
<body class="tools-page">
<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="container">

        <main class="status-page">
            <div class="status-container">
                <div class="status-card">
                    <div class="status-header">
                        <div class="status-indicator" id="status-indicator">
                            <span class="status-dot"></span>
                            <span class="status-text" data-i18n="statusLoading">Loading...</span>
                        </div>
                        <div class="status-header-actions">
                            <span class="status-time" id="last-updated">Last updated: -</span>
                            <button id="refresh-status" class="btn btn-small btn-secondary" data-i18n="statusRefresh">
                                Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <div class="status-card">
                    <h3 data-i18n="statusServiceInfoTitle">Service Information</h3>
                    <div class="status-info-grid">
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusVersionLabel">Version</div>
                            <div class="status-info-value" id="version">-</div>
                        </div>
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusUptimeLabel">Uptime</div>
                            <div class="status-info-value" id="uptime">-</div>
                        </div>
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusStartedLabel">Started</div>
                            <div class="status-info-value" id="start-time">-</div>
                        </div>
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusSpotsLabel">Spots</div>
                            <div class="status-info-value" id="spots-count">-</div>
                        </div>
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusCountriesLabel">Countries</div>
                            <div class="status-info-value" id="countries-count">-</div>
                        </div>
                        <div class="status-info-item">
                            <div class="status-info-label" data-i18n="statusLiveStationsLabel">Live Stations</div>
                            <div class="status-info-value" id="live-stations">-</div>
                        </div>
                    </div>
                </div>

                <div class="status-card">
                    <h3 data-i18n="statusUptimeHistoryTitle">Uptime History</h3>
                    <div class="health-history-header">
                        <span class="health-history-uptime" id="uptime-percentage">-% uptime</span>
                        <span class="health-history-period" id="history-period">-</span>
                    </div>
                    <div class="health-history-container" id="health-history">
                        <!-- Health history bars will be inserted here -->
                    </div>
                    <div class="health-history-legend">
                        <span class="health-history-legend-item">
                            <span class="health-history-legend-dot health-history-legend-up"></span>
                            <span data-i18n="statusOperational">Operational</span>
                        </span>
                        <span class="health-history-legend-item">
                            <span class="health-history-legend-dot health-history-legend-down"></span>
                            <span data-i18n="statusDegradedOrDown">Degraded/Down</span>
                        </span>
                    </div>
                </div>

                <div class="status-card">
                    <h3 data-i18n="statusApiEndpointsTitle">API Endpoints</h3>
                    <div class="status-endpoints">
                        <div class="status-endpoint" data-endpoint="/api/v1/health">
                            <div class="status-endpoint-info">
                                <span class="status-endpoint-dot"></span>
                                <span class="status-endpoint-name">/api/v1/health</span>
                            </div>
                            <span class="status-endpoint-status" data-i18n="statusChecking">checking...</span>
                        </div>
                        <div class="status-endpoint" data-endpoint="/api/v1/status">
                            <div class="status-endpoint-info">
                                <span class="status-endpoint-dot"></span>
                                <span class="status-endpoint-name">/api/v1/status</span>
                            </div>
                            <span class="status-endpoint-status" data-i18n="statusChecking">checking...</span>
                        </div>
                        <div class="status-endpoint" data-endpoint="/api/v1/spots">
                            <div class="status-endpoint-info">
                                <span class="status-endpoint-dot"></span>
                                <span class="status-endpoint-name">/api/v1/spots</span>
                            </div>
                            <span class="status-endpoint-status" data-i18n="statusChecking">checking...</span>
                        </div>
                        <div class="status-endpoint" data-endpoint="/api/v1/wind">
                            <div class="status-endpoint-info">
                                <span class="status-endpoint-dot"></span>
                                <span class="status-endpoint-name">/api/v1/wind</span>
                            </div>
                            <span class="status-endpoint-status" data-i18n="statusChecking">checking...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <!-- Footer content rendered by JavaScript -->
            </div>
        </footer>
    </div>
</div>
<script type="module" src="../js/page/status.js"></script>
</body>
</html>
